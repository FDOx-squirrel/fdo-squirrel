# ============================================================
# classification_rules.yaml
#
# Heuristic classification rules for FDO distributions
# Version: 0.1
# ============================================================

version: "0.1"

fdo_classes:
  fdo:SoftwareFDO:
    default_role: software
    rules:
      - match:
          extension: [".py", ".r", ".js", ".java"]
        role: script

      - match:
          filename: ["setup.py", "pyproject.toml", "requirements.txt"]
        role: configuration

      - match:
          extension: [".exe", ".jar", ".bin"]
        role: software

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".rst", ".txt"]
        role: documentation

      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata

      - match:
          path_prefix: ["tests/"]
        role: auxiliary

  fdo:AnalysisFDO:
    default_role: data
    rules:
      - match:
          extension: [".ipynb"]
        role: script

      - match:
          extension: [".py", ".r"]
        role: script

      - match:
          extension: [".csv", ".tsv", ".parquet", ".json"]
        role: data

      - match:
          path_prefix: ["results/"]
        role: result

      - match:
          extension: [".png", ".jpg", ".pdf"]
        role: result

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".txt"]
        role: documentation

      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata

  fdo:3DDataFDO:
    default_role: data
    # Rule order matters: rules are tried top to bottom and the first
    # match wins (fdo_rdf.py:_classify_role). Folder-based path_prefix
    # rules therefore come before the generic extension rules below, so
    # that e.g. a .jpeg under data/textures/ is classified by *where it
    # is* (auxiliary) rather than by its extension alone (which the
    # image-extension rule further down would otherwise resolve to
    # "documentation" first). Bundle layout reference: fdo-3d-packager's
    # step_bundle.py module docstring (data/model/, data/textures/,
    # data/images/, viewer/) -- confirmed against real CIIC 81 /
    # Freshford packages, see fdo-3d-packager PRIMER.md Teil D
    # (classification_rules.yaml gap) and this repo's PRIMER.md S18.
    rules:
      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".txt"]
        role: documentation

      - match:
          path_prefix: ["data/model/", "model/"]
        role: model

      - match:
          path_prefix: ["data/textures/", "textures/"]
        role: auxiliary

      - match:
          path_prefix: ["data/images/", "images/"]
        role: documentation

      - match:
          # 3DHOP miniviewer, vendored wholesale into the bundle
          # (fdo-3d-packager step_bundle.py) -- html/js/css plus its
          # LICENSE.txt (GPLv3 compliance file shipped alongside the
          # vendored code). Supporting software for rendering the
          # dataset, not the dataset itself.
          path_prefix: ["viewer/"]
        role: auxiliary

      - match:
          # Companion material file for .obj (mtllib) -- no rule existed
          # for this extension at all before, so it fell through to the
          # class default ("data").
          extension: [".mtl"]
        role: model

      - match:
          extension:
            [
              ".obj",
              ".ply",
              ".stl",
              ".glb",
              ".gltf",
              ".nxs",
              ".nxz",
              ".xyz",
              ".pts",
              ".ptx",
              ".dae",
            ]
        role: model

      - match:
          extension:
            [
              ".jpg",
              ".jpeg",
              ".png",
              ".tif",
              ".tiff",
              ".pdf",
              ".csv",
              ".xml",
              ".json",
            ]
        role: documentation

      - match:
          extension: [".las", ".laz"]
        role: data

  fdo:RegistryFDO:
    default_role: data
    rules:
      - match:
          filename_prefix: ["shapes"]
          extension: [".ttl"]
        role: metadata

      - match:
          filename: ["MD.cff", "CITATION.cff"]
        role: metadata

      - match:
          filename_prefix: ["README"]
          extension: [".md", ".txt"]
        role: documentation

      - match:
          extension: [".ttl", ".nt", ".jsonld", ".json"]
        role: data

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fdo-squirrel"
version = "1.0.0"
description = "FAIR Data Object, exchangeable (FDOx) reference implementation: ZIP package -> RDF"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
    "requests",
    "jsonschema",
    "beautifulsoup4",
]

# Pillow removed (S19, PRIMER.md): it was only ever used to convert
# mmdc's/resvg-py's PNG output into a JPG (fdo_overview.jpg, the three
# fdo_ttl_snippet_*.jpg cards). Both dropped - PNG+SVG only, everywhere -
# so nothing in this package imports PIL any more.

[project.optional-dependencies]
# S8 diagrams (fdo_files_roles*/fdo_md_cff*): rasterises the vendored
# SVGs to PNG. Same "optional, skipped with a warning if missing" pattern
# as mmdc for fdo_overview.png - the SVGs themselves are written either
# way, only the PNG render needs this.
diagrams = ["resvg-py>=0.4"]

[project.scripts]
fdo-squirrel = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "fdo_mermaid",
    "fdo_finalize",
    "fdo_manifest",
    "fdo_visuals_utils",
    "fdo_files_roles_common",
    "fdo_ttl_snippet",
    "fdo_files_roles_graph",
    "fdo_md_cff_diagram",
    "fdo_md_cff_graph",
]
packages = ["fdo", "crosswalks", "ingest", "schemas", "schemas.md_cff", "fonts"]

[tool.setuptools.package-data]
fdo = ["classification_rules.yaml"]
crosswalks = ["*.csv", "*.json", "*.yaml"]
"schemas.md_cff" = ["*.yaml"]
fonts = ["*.ttf"]
